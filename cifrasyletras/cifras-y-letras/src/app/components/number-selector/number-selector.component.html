<div class="number-selector">
  <h3 class="selector-title">¿Cuántos números grandes?</h3>
  <p class="selector-subtitle">(25, 50, 75, 100)</p>

  <div class="options">
    @for (option of options; track option) {
      <button
        class="option-btn"
        [class.selected]="settings().bigNumbersCount === option"
        (click)="selectBigNumbers(option)"
      >
        {{ option }}
      </button>
    }
  </div>

  <div class="selection-preview">
    <div class="preview-item">
      <span class="preview-label">Grandes:</span>
      <span class="preview-value big">{{ settings().bigNumbersCount }}</span>
    </div>
    <div class="preview-item">
      <span class="preview-label">Pequeños:</span>
      <span class="preview-value small">{{ getSmallCount(settings().bigNumbersCount) }}</span>
    </div>
  </div>
</div>
